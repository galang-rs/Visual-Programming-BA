server.port=${SERVER_PORT:8080}

# Application info
spring.application.name=${APP_NAME:ecosort-backend}

# Database configuration (Dapat dikonfigurasi melalui .env untuk H2 atau PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ecosortdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console for debugging
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (Secret key & expiration time loaded from .env)
app.jwt.secret=${JWT_SECRET:9a3f9e6b2c8a1f5d7e3c4b9a0f2e8d1c6b4a7f9e2d5c8a1f4b7e0d3c6a9f2b5e}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.ecosort=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
