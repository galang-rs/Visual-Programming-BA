server.port=8080

# Application info
spring.application.name=ecosort-backend

# H2 Database configuration (Runs out of the box with persistent file storage and in-memory option)
spring.datasource.url=jdbc:h2:file:./data/ecosortdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=9a3f9e6b2c8a1f5d7e3c4b9a0f2e8d1c6b4a7f9e2d5c8a1f4b7e0d3c6a9f2b5e
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.ecosort=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
